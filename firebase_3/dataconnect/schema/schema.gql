type User @table {
  email: String!
  createdAt: Timestamp!
  displayName: String
  avatarUrl: String
  isEnabled: Boolean
}

type Role @table {
  roleName: String!
  permissions: String! # JSON stored as String
  description: String
}

type UserRole @table(key: ["user", "role"]) {
  user: User!
  role: Role!
}

type Session @table {
  user: User!
  expiresAt: Timestamp!
  deviceFingerprint: String!
  ipAddress: String
  lastUsedAt: Timestamp
}

type AuditLog @table {
  user: User!
  eventType: String!
  timestamp: Timestamp!
  metadata: String # JSON stored as String
  ipAddress: String
}