name: basic_ai_app
description: AI Customer Intelligence Flutter application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.jpg"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  json_annotation: ^4.9.0 # Used for JSON serialization
  google_fonts: ^9.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  firebase_core: ^4.3.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_app_check: ^0.4.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^11.2.0
  ml_algo: ^16.15.1
  ml_dataframe: ^1.5.0
  flutter_ai_toolkit: ^0.10.0 # Use the latest version
  google_generative_ai: ^0.4.7 # Required for the raw Gemini SDK
  firebase_ai: ^3.15.0
  responsive_framework: ^1.5.1
  flutter_launcher_icons: ^0.13.1
  lottie: ^3.0.0
  intl_phone_field: ^3.1.0 # For phone input
  fluttertoast: ^8.2.1 # For toast notifications
  password_strength_checker: ^1.2.4
  syncfusion_flutter_charts: ^28.2.7
  carousel_slider: ^5.0.0
  razorpay_flutter: ^1.3.7
  flutter_cube: ^0.1.1
  audioplayers: ^6.2.0
  flutter_html: ^3.0.0-beta.2
  wakelock_plus: ^1.2.5
  confetti: ^0.8.0
  flutter_sound: ^9.25.4
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  record: ^7.1.1
  flutter_animate: ^4.1.1
  pinput: ^2.2.34
  responsiveness: ^1.2.8
  animated_icon: ^0.0.6
  just_audio: ^0.10.0
  audio_session: ^0.2.0
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.2
  image_picker: ^1.1.2
  jb: ^0.16.1
  dartle: ^0.34.1
  jni: ^1.0.3
  pdf: ^3.10.0      # Library responsible for building native programmatic PDF files
  printing: ^5.11.0 # Native platform channels hook managing system dialogue triggers
  fl_chart: ^0.70.0 # Standard Flutter charting library
  flutter_gen_ai_chat_ui: ^2.19.1
  google_ml_kit: ^0.16.0  # Official Google ML Kit Package




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.0 # Runs the code generator
  json_serializable: ^6.8.0 # Generates from/to JSON methods
  swagger_parser: ^1.44.3 # The clean Swagger conversion tool

flutter:
  uses-material-design: true

  assets:
    - assets/datasets/housing.csv
    - assets/models/housing_model.json
    - assets/vocabulary.json

dependency_overrides:
  # Satisfies both the app's requirement (^9.0.0) and the toolkit's strict constraint
  google_fonts: ">=6.2.1 <10.0.0"


