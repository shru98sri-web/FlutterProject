name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/configure-pages@v5
      - name: Build every Dart module and the Science Studio launcher
        run: bash tool/build_pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report deployment success
        run: |
          {
            echo "## Science Studio deployment successful ✅"
            echo ""
            echo "The physics_one single-main science app is live at: ${{ steps.deployment.outputs.page_url }}"
            echo "Each source Dart file was compiled and is available from its corresponding tab."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Science Studio deployment successful."
