name: eventhub_pro
description: "A production-grade, enterprise event management ecosystem app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Cloud Infrastructure
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  firebase_auth: ^5.1.3
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.1.2
  firebase_crashlytics: ^4.1.0

  # Security & System Integrations
  local_auth: ^2.2.0 # Hardware Biometric Authentication Framework
  mobile_scanner: ^5.1.1 # Camera Matrix Barcode/QR Scanning Processing Engine
  qr_flutter: ^4.1.0 # High-Fidelity Vector QR Code Raster Matrix Generators

  # File Operations & Media Visualizations
  pdf: ^3.10.8 # Vector PDF Generation Framework Engine
  printing: ^5.13.0 # Native OS AirPrint and Document Shares Pipelines
  path_provider: ^2.1.3 # Device OS File Systems Storage Director
  google_maps_flutter: ^2.6.1 # Interactive Embedded Map Canvas APIs
  fl_chart: ^0.68.0 # Rich Admin Analytics Charts Graphics Engines
  csv: ^6.0.0 # High-throughput CSV schema parsing engine
  add_2_calendar: ^3.0.1 # Natively injects events into iOS/Android default calendars
  google_mlkit_translation: ^0.11.0 # High-performance on-device AI language translation
  pay: ^3.3.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_pay_config.json
