name: Flutter Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  analyze_and_test:
    name: Code Verification, Validation, and Testing Operations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Artifacts
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) Environment
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install and Initialize Flutter Engine SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Synchronize Pub Packages Dependencies Architecture
        run: flutter pub get

      - name: Execute Code Formatting Verification Rules Checklist
        run: flutter format --set-exit-if-changed .

      - name: Execute Static Analysis Rules Matrix Linter Validation
        run: flutter analyze

      - name: Run Unit and Widget Test Framework Validations Suites
        run: flutter test

  compile_android_binaries:
    name: Compile Android App Bundles (AAB) Release Packages
    needs: analyze_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Artifacts
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) Environment
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install and Initialize Flutter Engine SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Synchronize Pub Packages Dependencies Architecture
        run: flutter pub get

      - name: Compile App Bundle Binary Target Package
        run: flutter build appbundle --release
